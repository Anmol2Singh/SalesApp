name: salesapp
description: "IZYHEAT Sales Workflow App — Internal tool for managing the full sales lifecycle."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # PDF generation
  pdf: ^3.11.3
  printing: ^5.14.2

  # Excel export
  excel: ^4.0.6

  # File sharing
  share_plus: ^10.1.4

  # Charts
  fl_chart: ^0.69.2

  # Local storage / caching
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.5

  # Environment variables
  flutter_dotenv: ^5.2.1

  # Networking / connectivity
  connectivity_plus: ^6.1.4

  # Image handling
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0

  # UI helpers
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_staggered_animations: ^1.1.1

  # Forms
  dropdown_search: ^5.0.6

  # Date/time picker
  syncfusion_flutter_datepicker: ^28.2.12

  # Typography
  google_fonts: ^6.2.1

  # Customer App dependencies
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_animate: ^4.5.2
  pin_code_fields: ^8.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: any
  hive_generator: any
  freezed: any
  json_serializable: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - .env
