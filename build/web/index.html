<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Insiya Solar Industry — Sales & Pipeline Management App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Insiya Solar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>IZYHEAT</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background-color: #0F172A;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease-out;
    }
    .brand-title {
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .brand-subtitle {
      color: #94A3B8;
      font-size: 13px;
      margin-bottom: 28px;
      font-weight: 500;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      border-top-color: #F59E0B;
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-status {
      margin-top: 16px;
      color: #64748B;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="brand-title">IZYHEAT</div>
    <div class="brand-subtitle">Insiya Solar Industry</div>
    <div class="spinner"></div>
    <div class="loading-status">Loading application...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() {
          loading.remove();
        }, 300);
      }
    });
  </script>

  <!-- Razorpay Standard Web Checkout -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
